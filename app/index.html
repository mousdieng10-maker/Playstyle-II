<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Playstyle II</title>
</head>
<body>
    <div class="home-screen" id="homeScreen">
        <div class="left-section">
            <div>
                 <h1 id="homeTitle">Playstyle <span style="color:rgb(80, 0, 80);">II</span></h1>
                <h3 id="homeSlogan">Because fc27 is kinda ahh.</h3>
            </div>
           
            <button id="enterBtn">Start</button>
        </div>
        <img id="homeimage" src="assets\adidas.png">
    </div>
    <div id="generateScreen">
        <h2>Generating your team.</h2>
        <div class="loader">

        </div>
    </div>
    <div id="playingScreen">
        <div class="left-side">
            <div class="attack"></div>
            <div class="midfield"></div>
            <div class="defence"></div>
            <div class="keeper"
        </div>
        <div class="right-size"></div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
