<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Playstyle II</title>
</head>
<body>
    <div class="home-screen" id="homeScreen">
        <div class="left-section">
            <div>
                <img class="homebrand" src="assets\brand.png" alt="Playstyle II">

            </div>
           
            <button id="enterBtn">Start</button>
        </div>
        <img id="homeimage" src="assets\adidas.png" alt="">
    </div>
    <div id="generateScreen">
        <h2>Generating your team.</h2>
        <div class="loader">

        </div>
    </div>
    <div id="playingScreen">
        <div class="starting-eleven">
            <h1 class="eleven-title">Your Starting Eleven</h1>
        <div class="left-side">
            <div class="attack">
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="LW"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="ST"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="RW"></h3></div>

            </div>
            <div class="midattack">
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="CAM"></h3></div>
            </div>
            <div class="midfield">
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="LM"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="CM"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="RM"></h3></div>
            </div>
            <div class="defence">
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="LB"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="CB"></h3></div>
                <div class="player"><span class="player-ovr"></span><img src="assets/silouhette.webp" class="profile-play"><span class="position-label"></span><h3 id="RB"></h3></div>
            </div>
            <div class="keeper">
                <div class="player"><span class="player-ovr"></span><span class="position-label"></span><h3 id="GK"></h3></div>
            </div>
        </div>
        </div>
        
        <div class="right-side">
            <button class="play-button" id="transferBtn">Transfer Market.</button>
            <button class="play-button" id="gameBtn">Play next game.</button>
            <button class="play-button" id="trainingBtn">Training</button>
            <button class="play-button" id="squadBtn">Manage Squad</button>
            <button class="play-button" id="leagueBtn">See League table</button>

        </div>

    </div>

    <div id="transfermarket">
        <div id="marketSell">
            <div id="inCard"></div>
            <div id="outCard"></div>
        </div>
        <div id="options">
            <button id="buyBtn"class="option-btn">BUY</button>
            <button id="negoBtn" class="option-btn">NEGOTIATE</button>
            <button id="bBtn" class="option-btn"><i  class="fa-solid fa-arrow-left"></i></button>
        </div>
        <i id="backButton" class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <div style="display:flex; flex-direction:column; gap:2em;">
            <span class="info-sect"id="money">$30002000</span>
            <span class="info-sect" id="team">11 Players</span>
            <span class="info-sect" id="avgOvr">69 OVR</span>
        </div>
        
        <div class="transfermarket">
       
        
            <div class="market-toolbar">
            <div class="market-heading">
                <h1>Buy players, upgrade your team</h1>
                <h3>Contrary to what neymar said, life ain't a gimmick, improve your team!</h3>
            </div>
            

            <div class="market-controls">
                <label class="search-field">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input class="search-bar" type="search" placeholder="Search players by name..." aria-label="Search players">
                </label>
                <div class="filter-list" aria-label="Player filters">
                    <span class="filter"><i class="fa-solid fa-futbol" aria-hidden="true"></i><span>All positions</span><i class="fa-solid fa-chevron-down filter-chevron" aria-hidden="true"></i></span>
                    <span class="filter"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Age</span><i class="fa-solid fa-chevron-down filter-chevron" aria-hidden="true"></i></span>
                    <span class="filter"><i class="fa-solid fa-star" aria-hidden="true"></i><span>Rating</span><i class="fa-solid fa-chevron-down filter-chevron" aria-hidden="true"></i></span>
                    <span class="filter"><i class="fa-solid fa-coins" aria-hidden="true"></i><span>Value</span><i class="fa-solid fa-chevron-down filter-chevron" aria-hidden="true"></i></span>
                </div>
            </div>
            </div>
        
        
        <div id="transferDiv" class="player-find">

        </div>
        </div>
        </div>

    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
