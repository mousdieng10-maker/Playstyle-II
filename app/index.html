<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Playstyle II</title>
</head>
<body>
    <div class="home-screen" id="homeScreen">
        <div class="left-section">
            <div>
                 <h1 id="homeTitle">Playstyle <span style="color:rgb(80, 0, 80);">II</span></h1>
                <h3 id="homeSlogan">Make your dream come true, get Lionel Ronaldo into your team.</h3>
            </div>
           
            <button id="enterBtn">Start</button>
        </div>
        <img id="homeimage" src="assets\adidas.png">
    </div>
    <div id="generateScreen">
        <h2>Generating your team.</h2>
        <div class="loader">

        </div>
    </div>
    <div id="playingScreen">
        <div style="display:flex; gap:20em; align-items: center;">
            <h1 class="eleven-title">Your Starting Eleven</h1>
        <div class="left-side">
            <div class="attack">
                <div class="player"><h3 id="LW"></h3></div>
                <div class="player"><h3 id="ST"></h3></div>
                <div class="player"><h3 id="RW"></h3></div>

            </div>
            <div class="midattack">
                <div class="player"><h3 id="CAM"></h3></div>
            </div>
            <div class="midfield">
                <div class="player"><h3 id="LM"></h3></div>
                <div class="player"><h3 id="CM"></h3></div>
                <div class="player"><h3 id="RM"></h3></div>
            </div>
            <div class="defence">
                <div class="player"><h3 id="LB"></h3></div>
                <div class="player"><h3 id="CB"></h3></div>
                <div class="player"><h3 id="RB"></h3></div>
            </div>
            <div class="keeper">
                <div class="player"><h3 id="GK"></h3></div>
            </div>
        </div>
        </div>
        
        <div class="right-side">
            <button class="play-button" id="transferBtn">Transfer Market.</button>
            <button class="play-button" id="gameBtn">Play next game.</button>
            <button class="play-button" id="trainingBtn">Training</button>
            <button class="play-button" id="squadBtn">Manage Squad</button>
            <button class="play-button" id="leagueBtn">See League table</button>

        </div>

    </div>

    <div id="transfermarket">
        <div style="display:flex; flex-direction:column; gap:2em;">
            <span class="info-sect"id="money">$30002000</span>
            <span class="info-sect" id="team">11 Players</span>
            <span class="info-sect" id="avgOvr">69 OVR</span>
        </div>
        
        <div class="transfermarket">
       
        
            <div style="display:flex; gap:2em;">
            <div>
                <h1 style="font-size:2.5em; color:purple;">Buy players, upgrade your team</h1>
                <h3 style="color:rgba(0,0,0,.7)">Contrary to what neymar said, life ain't a gimmick, improve your team!</h3>
            </div>
            

            <div>
                <input class="search-bar"   style="margin-bottom:.4em;"placeholder="search for players here">
                <div style="display:flex; gap:1em;"><span class="filter">All Positions</span><span class="filter">Age</span><span class="filter">Rating</span><span class="filter">Value</span></div>
            </div>
            </div>
        
        
        <div id="transferDiv" class="player-find">

        </div>
        </div>
        </div>

    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
